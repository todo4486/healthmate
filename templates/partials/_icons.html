{#
    Small inline SVG icon set. Usage:
        {% from "partials/_icons.html" import icon %}
        {{ icon("pulse") }}
    Icons are decorative (aria-hidden) and take the colour of the text around them.
#}
{% macro icon(name, class="") -%}
<svg class="icon {{ class }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == "pulse" -%}
    <polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/>
{%- elif name == "chat" -%}
    <path d="M4 5h16v11H9l-5 4z"/><line x1="8" y1="9.5" x2="16" y2="9.5"/><line x1="8" y1="12.5" x2="13" y2="12.5"/>
{%- elif name == "book" -%}
    <path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/>
{%- elif name == "check-square" -%}
    <rect x="4" y="4" width="16" height="16" rx="3"/><polyline points="8 12 11 15 16 9"/>
{%- elif name == "check" -%}
    <polyline points="5 12 10 17 19 7"/>
{%- elif name == "chart" -%}
    <line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="19" y1="20" x2="19" y2="10"/>
{%- elif name == "alert" -%}
    <path d="M10.3 4.2 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9.5" x2="12" y2="13.5"/><line x1="12" y1="17" x2="12.01" y2="17"/>
{%- elif name == "phone" -%}
    <path d="M5 3h3.5l2 5-2.5 1.5a11 11 0 0 0 6.5 6.5L16 13.5l5 2V19a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>
{%- elif name == "heart" -%}
    <path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>
{%- elif name == "info" -%}
    <circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/>
{%- elif name == "arrow-right" -%}
    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
{%- elif name == "menu" -%}
    <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
{%- elif name == "close" -%}
    <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
{%- elif name == "brain" -%}
    <path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>
{%- elif name == "user" -%}
    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == "eye" -%}
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "eye-off" -%}
    <path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.4 3.3"/><path d="M6.6 6.6A17.6 17.6 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><line x1="3" y1="3" x2="21" y2="21"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
{%- elif name == "send" -%}
    <path d="M4 12 20 4l-6 16-3-7z"/><line x1="11" y1="13" x2="20" y2="4"/>
{%- elif name == "plus" -%}
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
{%- elif name == "log-out" -%}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
{%- elif name == "shield" -%}
    <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><polyline points="9 12 11 14 15 10"/>
{%- elif name == "trash" -%}
    <polyline points="4 7 20 7"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>
{%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>
{%- endif -%}
</svg>
{%- endmacro %}
